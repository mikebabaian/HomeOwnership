name: Azure App Service CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: messiah-own-well
  NODE_VERSION: '18.x'
  DOTNET_VERSION: '10.0.x'

jobs:

  # ── 1. .NET tests ──────────────────────────────────────────────────────────
  test-api:
    runs-on: ubuntu-latest
    name: Test .NET API
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore api/HomeOwnership.Api/HomeOwnership.Api.csproj
          dotnet restore api/HomeOwnership.Api.Tests/HomeOwnership.Api.Tests.csproj

      - name: Test
        run: dotnet test api/HomeOwnership.Api.Tests/HomeOwnership.Api.Tests.csproj --no-restore --verbosity normal

  # ── 2. Build frontend + API, then deploy ───────────────────────────────────
  build-and-deploy:
    needs: test-api
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - uses: actions/checkout@v3

      # Node / React build
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      # Remove the SPA web.config — .NET handles routing via MapFallbackToFile
      - name: Remove static web.config from dist
        run: rm -f dist/web.config

      # .NET build
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Copy React output into the .NET wwwroot so it's served by the API host
      - name: Copy React build into API wwwroot
        run: |
          mkdir -p api/HomeOwnership.Api/wwwroot
          cp -r dist/. api/HomeOwnership.Api/wwwroot/

      - name: Publish .NET API (includes wwwroot)
        run: >
          dotnet publish api/HomeOwnership.Api/HomeOwnership.Api.csproj
          --configuration Release
          --output publish/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish/