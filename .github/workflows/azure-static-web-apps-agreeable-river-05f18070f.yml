name: Azure App Service CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: ownwell
  NODE_VERSION: '18.x'
  DOTNET_VERSION: '10.0.x'

jobs:

  # ── 1. .NET tests ──────────────────────────────────────────────────────────
  test-api:
    runs-on: ubuntu-latest
    name: Test .NET API
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore "${{ github.workspace }}/api/HomeOwnership.Api/HomeOwnership.Api.csproj"
          dotnet restore "${{ github.workspace }}/api/HomeOwnership.Api.Tests/HomeOwnership.Api.Tests.csproj"

      - name: Test
        run: dotnet test "${{ github.workspace }}/api/HomeOwnership.Api.Tests/HomeOwnership.Api.Tests.csproj" --no-restore --verbosity normal

  # ── 2. Build frontend + API, then deploy ───────────────────────────────────
  build-and-deploy:
    needs: test-api
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      # Node / React build
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      # Remove the SPA web.config — .NET handles routing via MapFallbackToFile
      - name: Remove static web.config from dist
        run: rm -f dist/web.config

      # .NET build
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Copy React output into the .NET wwwroot so it's served by the API host
      - name: Copy React build into API wwwroot
        run: |
          mkdir -p api/HomeOwnership.Api/wwwroot
          cp -r dist/. api/HomeOwnership.Api/wwwroot/

      - name: Restore .NET API
        run: dotnet restore "${{ github.workspace }}/api/HomeOwnership.Api/HomeOwnership.Api.csproj"

      - name: Publish .NET API (includes wwwroot)
        run: |
          dotnet publish "${{ github.workspace }}/api/HomeOwnership.Api/HomeOwnership.Api.csproj" \
            --configuration Release \
            --no-restore \
            --output "${{ github.workspace }}/publish"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3C65436C625A4E009039697AECC72C6E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_691D04B631C144A7BEFAF2A5A13A77C3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F89BBAF4B2DC46BBA8C414F1948E0285 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ github.workspace }}/publish